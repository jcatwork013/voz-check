# ── VozCheck — voz-check.9bricks.com ──────────────────────────────────────────
# AI moderation dashboard. Backend container `voz-check-web:80` (serves the React
# SPA and proxies /api → voz-check-api:8080) on network 9bricks-cluster.
# Install: copy to /home/ubuntu/nginx-central/conf.d/ then `docker exec central-nginx nginx -s reload`.
# Remove route: delete this file + reload nginx.

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name voz-check.9bricks.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (nhận từ stream SNI router :443 -> 127.0.0.1:8443)
server {
    listen 8443 ssl http2;
    server_name voz-check.9bricks.com;

    ssl_certificate /etc/nginx/ssl/9bricks.com.crt;
    ssl_certificate_key /etc/nginx/ssl/9bricks.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 10M;

    location / {
        limit_req zone=general burst=100 nodelay;
        limit_conn addr 10;

        proxy_pass http://voz-check-web:80;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }
}
